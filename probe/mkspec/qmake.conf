#
# qmake device spec for rebuilding the NW-A50 series eglfs plugin with gcc
# 4.9 / glibc 2.23 (the nw-installer crosstool), after unknown321/wampy's
# server/armv5-unknown-linux-gnueabihf spec.
#
# Two passes: the first builds Qt with Sony's stock hooks; the second rebuilds
# only plugins/platforms/eglfs with PROBE_CFLAGS=-DWMPROBE, which adds the
# resource overlay and the probe and links QtQuick/QtQml/QtNetwork through EGL_LIB.
#

include(../common/linux_device_pre.conf)

QT_QPA_DEFAULT_PLATFORM = eglfs

QMAKE_LIBDIR_EGL        = $$QMAKE_LIBDIR_OPENGL_ES2
QMAKE_LIBS_EGL          = -lEGL -lGLESv2 $(EGL_LIB) -lrt

DISTRO_OPTS += deb-multi-arch
DISTRO_OPTS += hard-float

# Same CPU flags as Sony's linux-mt8590 specs; -I/libs supplies Khronos
# EGL/GLES headers since the Mali SDK headers are not public.
QMAKE_CFLAGS           += \
                          -mthumb \
                          -mcpu=cortex-a7 \
                          -mtune=cortex-a7 \
                          -mfpu=neon-vfpv4 \
                          -mthumb-interwork \
                          -mfloat-abi=hard \
                          -fstack-protector-strong \
                          -fno-omit-frame-pointer \
                          -fPIC \
                          -I/libs \
                          -I/gladinc \
                          -I/gladinc/KHR \
                          -I/qt/qtdeclarative/include \
                          -I/qt/qtdeclarative/include/QtQml \
                          -I/qt/qtdeclarative/include/QtQuick \
                          -I/qt/qtbase/include/QtNetwork \
                          -g \
                          $(PROBE_CFLAGS)

QMAKE_CXXFLAGS          = $$QMAKE_CFLAGS -std=gnu++11

PROBE = $$(PROBE_CFLAGS)
contains(PROBE, .*WMPROBE.*) {
    EGLFS_PLATFORM_HOOKS_SOURCES = $$PWD/overlay.cpp $$PWD/probe.cpp $$PWD/qeglfshooks_mt8590.cpp
} else {
    EGLFS_PLATFORM_HOOKS_SOURCES = $$PWD/qeglfshooks_mt8590.cpp
}

load(qt_config)
