<script>
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};

// Reel eyes: white reel, dark hub as the pupil with the six spindle teeth,
// glancing up toward the notes.
function eye(g) {
  el("circle", { r: 18, fill: "url(#eyeGrad)" }, g);
  el("circle", { r: 18, fill: "none", stroke: "#0b0807", "stroke-opacity": 0.35, "stroke-width": 1 }, g);
  const hub = el("g", { transform: "translate(3 -2.5)" }, g);
  el("circle", { r: 9.6, fill: "url(#hubGrad)" }, hub);
  el("circle", { r: 4.4, fill: "none", stroke: "#d9ae5c", "stroke-width": 1.1, opacity: 0.9 }, hub);
  for (let i = 0; i < 6; i++) {
    el("rect", { x: -0.6, y: -4.4, width: 1.2, height: 1.9, fill: "#d9ae5c", opacity: 0.9,
                 transform: `rotate(${i * 60 + 15})` }, hub);
  }
  el("circle", { cx: -3.8, cy: -4.3, r: 2.9, fill: "#fff" }, hub);
  el("circle", { cx: 4.3, cy: 3.8, r: 1.2, fill: "#fff", opacity: 0.85 }, hub);
}
eye(document.getElementById("eyeL"));
eye(document.getElementById("eyeR"));

function screw(g, x, y, a) {
  el("circle", { cx: x, cy: y + 0.6, r: 3.6, fill: "#8a6a40", opacity: 0.5 }, g);
  el("circle", { cx: x, cy: y, r: 3.3, fill: "url(#gold)" }, g);
  el("path", { d: `M${x - 2.1} ${y} h4.2 M${x} ${y - 2.1} v4.2`, stroke: "#6b4c22", "stroke-width": 0.9,
               "stroke-linecap": "round", transform: `rotate(${a} ${x} ${y})` }, g);
}
const screws = document.getElementById("screws");
screw(screws, 151, 517, 12); screw(screws, 329, 517, 40);
screw(screws, 152, 626, 70); screw(screws, 328, 626, 25);

// Coiled headphone cable from the left cup down to a gold jack on the floor.
function cord(g) {
  const p0 = [118, 568], c = [92, 640], p1 = [104, 668];
  const pts = [];
  const N = 520;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const bx = (1 - t) ** 2 * p0[0] + 2 * (1 - t) * t * c[0] + t * t * p1[0];
    const by = (1 - t) ** 2 * p0[1] + 2 * (1 - t) * t * c[1] + t * t * p1[1];
    const dx = 2 * (1 - t) * (c[0] - p0[0]) + 2 * t * (p1[0] - c[0]);
    const dy = 2 * (1 - t) * (c[1] - p0[1]) + 2 * t * (p1[1] - c[1]);
    const len = Math.hypot(dx, dy);
    const tx = dx / len, ty = dy / len, nx = -ty, ny = tx;
    const coil = t > 0.12 && t < 0.86 ? Math.sin(Math.PI * (t - 0.12) / 0.74) ** 0.5 : 0;
    const ph = t * 2 * Math.PI * 13;
    const r = 4.2 * coil;
    pts.push([bx + nx * r * Math.cos(ph) + tx * r * 0.9 * Math.sin(ph), by + ny * r * Math.cos(ph) + ty * r * 0.9 * Math.sin(ph)]);
  }
  pts.push([96, 674], [84, 676], [74, 676]);
  const d = "M" + pts.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" L");
  el("path", { d, fill: "none", stroke: "#15151a", "stroke-width": 2.6, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  el("path", { d, fill: "none", stroke: "#5d5e68", "stroke-width": 1.1, "stroke-linecap": "round", "stroke-linejoin": "round",
               transform: "translate(-0.4 -0.5)" }, g);
  el("rect", { x: 56, y: 672.5, width: 18, height: 7, rx: 2, fill: "url(#housingGrad)" }, g);
  el("rect", { x: 47, y: 674, width: 9, height: 4, fill: "url(#gold)" }, g);
  el("path", { d: "M47 674 L40 675 Q37.5 676 40 677 L47 678 Z", fill: "url(#gold)" }, g);
  el("rect", { x: 44.6, y: 674.4, width: 0.9, height: 3.2, fill: "#3b2a12" }, g);
  el("rect", { x: 50.5, y: 674, width: 0.9, height: 4, fill: "#3b2a12" }, g);
}
cord(document.getElementById("cord"));

function note8(g, x, y, s, flip) {
  const h = el("g", { transform: `translate(${x} ${y}) scale(${s}) rotate(${flip || 0})` }, g);
  el("ellipse", { cx: 0, cy: 0, rx: 5.2, ry: 3.8, transform: "rotate(-22)" }, h);
  el("rect", { x: 3.4, y: -21, width: 1.7, height: 21 }, h);
  el("path", { d: "M5 -21 C6 -15 13 -14 11 -6 C10.5 -10 8 -12.5 5 -13 Z" }, h);
}
function noteBeam(g, x, y, s) {
  const h = el("g", { transform: `translate(${x} ${y}) scale(${s}) rotate(-8)` }, g);
  el("ellipse", { cx: 0, cy: 0, rx: 5.2, ry: 3.8, transform: "rotate(-22)" }, h);
  el("ellipse", { cx: 16, cy: -3, rx: 5.2, ry: 3.8, transform: "rotate(-22 16 -3)" }, h);
  el("rect", { x: 3.4, y: -22, width: 1.7, height: 22 }, h);
  el("rect", { x: 19.4, y: -25, width: 1.7, height: 22 }, h);
  el("path", { d: "M3.4 -22 L21.1 -25 L21.1 -20.5 L3.4 -17.5 Z" }, h);
}
const notes = document.getElementById("notes");
noteBeam(notes, 384, 500, 1.0);
note8(notes, 420, 462, 0.78);
note8(notes, 368, 458, 0.55);

const motes = document.getElementById("motes");
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 34; i++) {
  const x = 30 + rnd() * 420, y = 40 + rnd() * 300;
  const inBeam = Math.abs(x - 240) < 30 + (y / 690) * 150;
  el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: (0.4 + rnd() * 0.7).toFixed(2),
                 opacity: ((inBeam ? 0.35 : 0.12) + rnd() * 0.25).toFixed(2) }, motes);
}
for (let i = 0; i < 26; i++) {
  const a = rnd() * Math.PI * 2, r = 120 + rnd() * 130;
  const x = 240 + Math.cos(a) * r * 1.05, y = 552 + Math.sin(a) * r * 0.75;
  if (y > 670 || y < 380) continue;
  el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: (0.5 + rnd() * 0.9).toFixed(2), opacity: (0.25 + rnd() * 0.6).toFixed(2) }, motes);
}

document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(() => { window.__done = true; })));
</script>
